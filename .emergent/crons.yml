crons:
  - name: monthly-svc-pay
    description: "Auto-drafts the month's fixed transportation service payment requests on the 1st"
    cron: "30 2 1 * *"
    timezone: "Asia/Kolkata"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/monthly-service-payments"
    method: POST
    enabled: true
